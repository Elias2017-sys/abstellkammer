<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Abstellkammer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#efe8d8;
  --surface:#fffdf8;
  --surface-alt:#f7f1e3;
  --ink:#2b2420;
  --ink-soft:#7a6f5f;
  --accent:#c98a2b;
  --accent-soft:#efd9ae;
  --sage:#6b8068;
  --sage-soft:#dde5d9;
  --danger:#b8493c;
  --danger-soft:#f0d8d3;
  --border:#ddd3bc;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, rgba(43,36,32,0.06) 1px, transparent 0);
  background-size:18px 18px;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:100px;
}

.wrap{max-width:520px; margin:0 auto; padding:16px 14px 0;}

header{padding:14px 4px 10px; position:sticky; top:0; z-index:20; background:var(--bg);}
h1{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.5px; text-transform:uppercase; margin:0 0 12px;}

.search-box{display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:9px 12px;}
.search-box input{border:none; outline:none; background:transparent; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink); width:100%;}
.search-box input::placeholder{color:var(--ink-soft);}
.search-icon{font-size:14px; color:var(--ink-soft); flex:0 0 auto;}

.stats-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.stat-pill{font-family:'JetBrains Mono',monospace; font-size:10.5px; background:var(--surface-alt); border:1px solid var(--border); border-radius:20px; padding:4px 9px; color:var(--ink-soft);}

main{padding:8px 4px 0;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state .big{font-size:38px; margin-bottom:10px;}
.empty-state .msg{font-size:14.5px; line-height:1.5;}

/* ---- Shelf (Regal) ---- */
.shelf{background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden;}
.shelf-header{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none;}
.shelf-tag-hole{width:9px; height:9px; border-radius:50%; background:var(--bg); border:1.5px solid var(--ink-soft); flex:0 0 auto;}
.shelf-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; letter-spacing:0.3px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.shelf-name input{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; border:none; border-bottom:1.5px dashed var(--accent); background:transparent; outline:none; width:100%; color:var(--ink);}
.shelf-count{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); background:var(--surface-alt); border-radius:20px; padding:3px 9px; flex:0 0 auto;}
.chevron{font-size:12px; color:var(--ink-soft); transition:transform 0.2s ease; flex:0 0 auto;}
.open > .shelf-header .chevron, .board.open .board-header .chevron{transform:rotate(90deg);}
.shelf-actions{display:flex; gap:6px; flex:0 0 auto;}
.icon-btn{border:none; background:transparent; cursor:pointer; font-size:14px; padding:4px 6px; border-radius:6px; color:var(--ink-soft); line-height:1;}
.icon-btn:hover{background:var(--surface-alt); color:var(--ink);}
.icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}
.shelf-body{display:none; border-top:1px dashed var(--border); padding:8px 10px 10px;}
.shelf.open .shelf-body{display:block;}
.shelf-hint{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); padding:2px 4px 8px;}

/* ---- Board (Brett) ---- */
.board{margin:0 0 8px 6px; border-left:2px solid var(--border); padding-left:10px;}
.board-header{display:flex; align-items:center; gap:9px; padding:6px 4px; cursor:pointer; user-select:none;}
.board-badge{width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.board-label{font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-soft); flex:1;}
.board-count{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); background:var(--surface-alt); border-radius:20px; padding:2px 8px; flex:0 0 auto;}
.board-body{display:none; padding:2px 2px 6px;}
.board.open .board-body{display:block;}

.confirm-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--danger-soft); border-radius:8px; padding:6px 10px; font-size:12.5px; color:var(--danger); margin:6px 0;}
.confirm-row button{border:none; border-radius:6px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
.confirm-yes{background:var(--danger); color:#fff;}
.confirm-no{background:transparent; color:var(--ink-soft);}

/* ---- Item ---- */
.item-row{display:flex; align-items:flex-start; gap:8px; padding:8px 4px; border-bottom:1px solid var(--surface-alt);}
.item-row:last-child{border-bottom:none;}
.item-thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; flex:0 0 auto; border:1px solid var(--border); cursor:pointer; background:var(--surface-alt);}
.item-thumb-placeholder{width:36px; height:36px; border-radius:8px; flex:0 0 auto; background:var(--surface-alt); border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft);}
.item-main{flex:1; min-width:0; padding-top:1px;}
.item-top-line{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.item-name{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reihe-badge{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--sage); background:var(--sage-soft); padding:1px 6px; border-radius:10px; flex:0 0 auto;}
.item-note{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.qty-stepper{display:flex; align-items:center; background:var(--surface-alt); border-radius:8px; flex:0 0 auto;}
.qty-stepper button{border:none; background:transparent; cursor:pointer; width:24px; height:24px; font-size:14px; color:var(--accent); font-weight:700;}
.qty-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; min-width:22px; text-align:center;}
.qty-low .qty-val{color:var(--danger);}
.item-actions{display:flex; gap:2px; flex:0 0 auto; padding-top:2px;}

/* edit form (inline) */
.edit-form input{font-family:'Inter',sans-serif; font-size:13px; border:1.5px solid var(--border); border-radius:7px; padding:6px 8px; outline:none; background:var(--surface); margin-bottom:5px; width:100%;}
.edit-form input:focus{border-color:var(--accent);}
.edit-form-row{display:flex; gap:6px;}
.edit-form-row .inp-reihe{width:70px; flex:0 0 auto;}
.photo-row{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
.photo-btn{border:1.5px dashed var(--border); background:var(--surface); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--ink-soft); cursor:pointer;}
.photo-btn:hover{border-color:var(--accent); color:var(--accent);}
.photo-remove{font-size:11px; color:var(--danger); background:none; border:none; cursor:pointer;}
.edit-actions{display:flex; gap:6px; margin-top:4px;}
.edit-actions button{border:none; border-radius:7px; font-size:12.5px; font-weight:600; padding:6px 12px; cursor:pointer;}
.btn-save{background:var(--sage); color:#fff;}
.btn-cancel{background:var(--surface-alt); color:var(--ink-soft);}

.add-item-row{margin-top:6px; background:var(--surface-alt); border-radius:10px; padding:8px;}
.add-shelf-trigger{width:100%; text-align:left; background:transparent; border:none; font-family:'Oswald',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; padding:6px 4px;}
.add-shelf-trigger:hover{color:var(--accent);}
.add-shelf-trigger.top-level{font-size:14.5px; margin-top:4px;}

.add-shelf-card{border:1.5px dashed var(--border); border-radius:12px; padding:12px 14px; margin-top:6px; margin-bottom:20px;}
.add-shelf-form{display:flex; flex-direction:column; gap:8px;}
.add-shelf-form label{font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
.add-shelf-form input{font-family:'Oswald',sans-serif; font-size:14.5px; border:1.5px solid var(--border); border-radius:8px; padding:8px 10px; outline:none; background:var(--surface);}
.add-shelf-form input:focus{border-color:var(--accent);}
.add-shelf-form button{border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; cursor:pointer; align-self:flex-start;}

.search-results{padding:4px 4px 0;}
.search-hit{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
.hit-loc-badge{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--sage-soft); color:var(--sage); padding:2px 8px; border-radius:20px; flex:0 0 auto;}
.no-results{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:14px;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:100;}
.toast.show{opacity:1;}

.status-line{text-align:center; font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; padding:14px 0 6px;}

.photo-overlay{position:fixed; inset:0; background:rgba(20,16,12,0.9); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.photo-overlay img{max-width:100%; max-height:100%; border-radius:10px;}

/* ---- Lock screen ---- */
#lockScreen{position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px;}
.lock-card{max-width:340px; width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:26px 22px; text-align:center;}
.lock-icon{font-size:34px; margin-bottom:8px;}
.lock-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
.lock-sub{font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.4;}
.lock-input{width:100%; font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:6px; text-align:center; border:1.5px solid var(--border); border-radius:10px; padding:12px; outline:none; background:var(--surface-alt); margin-bottom:10px;}
.lock-input:focus{border-color:var(--accent);}
.lock-btn{width:100%; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:14.5px; padding:11px; cursor:pointer; margin-bottom:6px;}
.lock-error{color:var(--danger); font-size:12.5px; min-height:16px; margin-bottom:4px;}
.lock-hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
.settings-trigger{position:fixed; top:14px; right:16px; z-index:21; background:var(--surface-alt); border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12px; color:var(--ink-soft); cursor:pointer;}

.scan-btn{width:100%; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; padding:10px; cursor:pointer; margin-top:8px;}

#scanOverlay{position:fixed; inset:0; background:rgba(20,16,12,0.94); z-index:250; display:flex; align-items:center; justify-content:center; padding:20px;}
.scan-card{max-width:380px; width:100%; background:var(--surface); border-radius:14px; padding:18px; text-align:center; position:relative;}
.scan-close{position:absolute; top:8px; right:10px; background:none; border:none; font-size:18px; color:var(--ink-soft); cursor:pointer;}
.scan-video-wrap{width:100%; aspect-ratio:4/3; background:#000; border-radius:10px; overflow:hidden; margin-bottom:10px; position:relative;}
.scan-video-wrap video{width:100%; height:100%; object-fit:cover;}
.scan-status{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
.scan-form label{display:block; font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin:8px 0 3px; text-align:left;}
.scan-form input, .scan-form select{width:100%; font-family:'Inter',sans-serif; font-size:14px; border:1.5px solid var(--border); border-radius:8px; padding:8px 10px; outline:none; background:var(--surface-alt);}
.scan-form input:focus, .scan-form select:focus{border-color:var(--accent);}
.scan-save-btn{width:100%; border:none; border-radius:10px; background:var(--sage); color:#fff; font-weight:600; font-size:14px; padding:10px; cursor:pointer; margin-top:12px;}

.ing-suggestions{background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; margin-top:2px; max-height:160px; overflow-y:auto;}
.ing-suggestion-item{padding:7px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
.ing-suggestion-item:last-child{border-bottom:none;}
.ing-suggestion-item:hover{background:var(--accent-soft);}

/* ---- Tabs ---- */
.tab-bar{display:flex; gap:6px; margin-bottom:12px;}
.tab-btn{flex:1; border:1.5px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 8px; font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer; text-align:center;}
.tab-btn.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}

/* ---- Recipes ---- */
.recipe{background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden;}
.recipe-header{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none;}
.recipe-icon{font-size:16px; flex:0 0 auto;}
.recipe-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.recipe-name input{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; border:none; border-bottom:1.5px dashed var(--accent); background:transparent; outline:none; width:100%; color:var(--ink);}
.recipe-avail-badge{font-family:'JetBrains Mono',monospace; font-size:11px; border-radius:20px; padding:3px 9px; flex:0 0 auto;}
.recipe-avail-badge.ok{background:var(--sage-soft); color:var(--sage);}
.recipe-avail-badge.missing{background:var(--danger-soft); color:var(--danger);}
.recipe-body{display:none; border-top:1px dashed var(--border); padding:8px 12px 14px;}
.recipe.open .recipe-body{display:block;}
.recipe.open .recipe-header .chevron{transform:rotate(90deg);}

.section-label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin:10px 0 6px;}
.ingredient-row{display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--surface-alt);}
.ingredient-row:last-child{border-bottom:none;}
.ingredient-status{font-size:14px; flex:0 0 auto; width:18px; text-align:center;}
.ingredient-main{flex:1; min-width:0; font-size:14px;}
.ingredient-amount{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
.step-row{display:flex; align-items:flex-start; gap:8px; padding:6px 2px; border-bottom:1px solid var(--surface-alt);}
.step-row:last-child{border-bottom:none;}
.step-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--accent); flex:0 0 auto; width:18px; padding-top:1px;}
.step-text{flex:1; font-size:13.5px; line-height:1.4;}
.cook-btn{width:100%; border:none; border-radius:10px; padding:12px; font-family:'Oswald',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer; margin-top:12px;}
.cook-btn.ready{background:var(--sage); color:#fff;}
.cook-btn.blocked{background:var(--surface-alt); color:var(--ink-soft); cursor:not-allowed;}
.cook-hint{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:6px;}

/* ---- Shopping list ---- */
.threshold-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:12px; font-size:13px;}
.threshold-row input{width:50px; font-family:'JetBrains Mono',monospace; font-size:14px; text-align:center; border:1.5px solid var(--border); border-radius:7px; padding:5px; outline:none; background:var(--surface-alt);}
.threshold-row input:focus{border-color:var(--accent);}
.shop-item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.shop-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--sage); background:transparent; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--sage); font-size:13px;}
.shop-check:hover{background:var(--sage-soft);}
.shop-main{flex:1; min-width:0;}
.shop-name{font-size:14px; font-weight:500;}
.shop-sub{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:1px;}
.shop-add-row{display:flex; gap:8px; margin-top:4px; margin-bottom:20px;}
.shop-add-row input{flex:1; font-family:'Inter',sans-serif; font-size:13.5px; border:1.5px solid var(--border); border-radius:8px; padding:9px 10px; outline:none; background:var(--surface);}
.shop-add-row input:focus{border-color:var(--accent);}
.shop-add-row button{border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:13px; padding:9px 16px; cursor:pointer;}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Lädt …</div>
  </div>
</div>

<button class="settings-trigger" id="logoutTrigger" style="display:none;">🚪 Abmelden</button>

<div class="wrap" id="appContent" style="display:none;">
  <header>
    <h1>Abstellkammer</h1>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabInventar">📦 Inventar</button>
      <button class="tab-btn" id="tabRezepte">🍳 Rezepte</button>
      <button class="tab-btn" id="tabGefrier">🧊 Gefrierschränke</button>
      <button class="tab-btn" id="tabEinkauf">🛒 Einkaufsliste</button>
    </div>
    <div id="inventarHeaderExtra">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="text" placeholder="Gegenstand suchen …" autocomplete="off">
      </div>
      <button class="scan-btn" id="scanBarcodeBtn">📷 Barcode scannen</button>
      <div class="stats-row" id="statsRow"></div>
    </div>
    <div id="freezerHeaderExtra" style="display:none;">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="freezerSearchInput" type="text" placeholder="Gegenstand suchen …" autocomplete="off">
      </div>
      <button class="scan-btn" id="scanBarcodeBtnFreezer">📷 Barcode scannen</button>
      <div class="stats-row" id="freezerStatsRow"></div>
    </div>
    <div id="einkaufHeaderExtra" style="display:none;">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="shopSearchInput" type="text" placeholder="Auf der Liste suchen …" autocomplete="off">
      </div>
    </div>
  </header>

  <main id="mainArea">
    <div class="empty-state"><div class="big">📦</div><div class="msg">Lade Inventar …</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div id="scanOverlay" style="display:none;">
  <div class="scan-card" id="scanCard"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-uO98tICNd67KtVtxYQi_7npE8f7Zj6Y",
  authDomain: "abstellkammermanager.firebaseapp.com",
  projectId: "abstellkammermanager",
  storageBucket: "abstellkammermanager.firebasestorage.app",
  messagingSenderId: "1062426914155",
  appId: "1:1062426914155:web:f225a555cce79711d8f02e"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

let familyId = null; // wird nach dem Login gesetzt (eigene Familie/Zugangscode)

function familyDocRef(name){ return doc(db, 'families', familyId, 'state', name); }

// Kleine Helfer für den Zugriff auf einzelne Dokumente innerhalb der eigenen Familie
async function fsGetDoc(name){
  try{
    const snap = await getDoc(familyDocRef(name));
    return snap.exists() ? snap.data() : null;

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * (maxDim / w)); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * (maxDim / h)); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    main.innerHTML = renderSearchResults(term);

  if(data.shelves.length === 0){

function renderShelf(shelf){
  const isOpen = !!shelf._open;
  const isEditingName = editingShelfId === shelf.id;
  const isConfirming = confirmDeleteId === ('shelf:' + shelf.id);
  const totalItems = shelf.boards.reduce((a,b)=>a+b.items.length,0);
  const nameHtml = isEditingName
    ? `<input type="text" class="shelf-name-input" data-shelf="${shelf.id}" value="${escapeHtml(shelf.name)}">`
    : `<span>${escapeHtml(shelf.name)}</span>`;

  const realBoards = shelf.boards.filter(b=>!b.floor);
  const floorBoards = shelf.boards.filter(b=>b.floor);
  // Letter reflects creation order among real boards (A = first/bottom-most). Display top-to-bottom
  // so the highest board (physically at the top) appears first on screen, A last, Boden at the very end.
  const lettered = realBoards.map((board, i) => ({ board, letter: boardLetter(i) }));
  const displayBoards = [...lettered].reverse();
  const hasFloor = floorBoards.length > 0;

  const boardsHtml = displayBoards.map(({board, letter}) => renderBoard(shelf, board, letter, false)).join('')
    + floorBoards.map(board => renderBoard(shelf, board, 'Boden', true)).join('');

  return `

function renderSearchResults(term){
  const hits = [];
  data.shelves.forEach(shelf=>{
    let realIdx = 0;
    shelf.boards.forEach(board=>{
      const letter = board.floor ? 'Boden' : boardLetter(realIdx);
      if(!board.floor) realIdx++;
      board.items.forEach(item=>{

          hits.push({shelf, board, letter, item});

  if(hits.length === 0) return `<div class="no-results">Nichts gefunden für „${escapeHtml(term)}"</div>`;
  return `<div class="search-results">${hits.map(h=>{
    const isEditing = editingItem && editingItem.shelfId===h.shelf.id && editingItem.boardId===h.board.id && editingItem.itemId===h.item.id;
    if(isEditing) return renderItemForm(h.shelf, h.board, h.item);

function attachSearchJumpHandlers(){
  document.querySelectorAll('[data-search-hit]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('.qty-stepper') || e.target.closest('[data-jump-to-shelf]')) return;
    const [sid,bid,iid] = el.getAttribute('data-search-hit').split(':');
    editingItem = {shelfId:sid, boardId:bid, itemId:iid};
    pendingPhoto = null;
    render();
  }));
  document.querySelectorAll('[data-jump-to-shelf]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [sid,bid] = el.getAttribute('data-jump-to-shelf').split(':');
    const shelf = data.shelves.find(s=>s.id===sid);
    const board = shelf.boards.find(b=>b.id===bid);
    shelf._open = true; board._open = true;
    document.getElementById('searchInput').value = '';
    render();
    setTimeout(()=>{
      const el2 = document.querySelector(`[data-shelf="${sid}"]`);
      if(el2) el2.scrollIntoView({behavior:'smooth', block:'start'});
    }, 50);
  }));
}

// ---------- Recipes: matching against inventory ----------

function collectMatches(ingredientName){
  const norm = (ingredientName||'').trim().toLowerCase();
  const matches = [];
  data.shelves.forEach(shelf=>shelf.boards.forEach(board=>board.items.forEach(item=>{
    if(item.name.trim().toLowerCase() === norm) matches.push(item);
  })));
  return matches;
}

function getAllProductNames(){
  const names = new Set();
  data.shelves.forEach(shelf=>shelf.boards.forEach(board=>board.items.forEach(item=>{
    if(item.name) names.add(item.name);
  })));
  return Array.from(names).sort((a,b)=>a.localeCompare(b, 'de'));
}

function totalAvailable(ingredientName){
  return collectMatches(ingredientName).reduce((sum,it)=>sum+(Number(it.qty)||0),0);
}

function checkRecipe(recipe){
  const rows = recipe.ingredients.map(ing=>{
    const available = totalAvailable(ing.name);
    const needed = Number(ing.amount)||0;
    return { ing, available, needed, ok: available >= needed };
  });
  return { rows, allOk: rows.length > 0 && rows.every(r=>r.ok) };
}

function cookRecipe(recipeId){
  const recipe = recipesData.recipes.find(r=>r.id===recipeId);
  const { allOk } = checkRecipe(recipe);
  if(!allOk){ showToastMsg('Es fehlen noch Zutaten'); return; }
  recipe.ingredients.forEach(ing=>{
    let needed = Number(ing.amount)||0;
    const matches = collectMatches(ing.name);
    for(const item of matches){
      if(needed <= 0) break;
      const deduct = Math.min(Number(item.qty)||0, needed);
      item.qty = (Number(item.qty)||0) - deduct;
      needed -= deduct;
    }
  });
  queueSave();
  showToastMsg('Guten Appetit! Zutaten abgezogen 🍽️');
  render();
}

        <div class="item-name">${escapeHtml(h.item.name)}</div>
        ${h.item.note ? `<div class="item-note">${escapeHtml(h.item.note)}</div>` : ''}
      </div>
      <span class="hit-loc-badge">${escapeHtml(h.freezer.name)} · ${h.letter}</span>
      <div class="qty-stepper">
        <button data-freezer-qty-dec="${h.freezer.id}:${h.board.id}:${h.item.id}">−</button>
        <span class="qty-val">${h.item.qty}</span>
        <button data-freezer-qty-inc="${h.freezer.id}:${h.board.id}:${h.item.id}">+</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderFreezerTab(){
  if(freezerData.freezers.length === 0){
    return `
      <div class="empty-state"><div class="big">🧊</div><div class="msg">Noch keine Gefrierschränke angelegt.<br>Leg deinen ersten an.</div></div>
      ${renderAddFreezer()}`;
  }
  return freezerData.freezers.map(fz => renderFreezerCard(fz)).join('') + renderAddFreezer();
}

function renderFreezerCard(freezer){
  const isOpen = !!freezer._open;
  const isEditingName = editingFreezerId === freezer.id;
  const isConfirming = confirmDeleteId === ('freezer:' + freezer.id);
  const totalItems = freezer.boards.reduce((a,b)=>a+b.items.length,0);
  const nameHtml = isEditingName
    ? `<input type="text" class="freezer-name-input" data-freezer="${freezer.id}" value="${escapeHtml(freezer.name)}">`
    : `<span>${escapeHtml(freezer.name)}</span>`;

  const lettered = freezer.boards.map((board, i) => ({ board, letter: boardLetter(i) }));
  const displayBoards = [...lettered].reverse();
  const boardsHtml = displayBoards.map(({board, letter}) => renderFreezerBoard(freezer, board, letter)).join('');

  return `
  <div class="shelf ${isOpen?'open':''}" data-freezer="${freezer.id}">
    <div class="shelf-header" data-toggle-freezer="${freezer.id}">
      <span class="shelf-tag-hole"></span>
      <div class="shelf-name">${nameHtml}</div>
      <span class="shelf-count">${totalItems}</span>
      <div class="shelf-actions">
        ${isEditingName
          ? `<button class="icon-btn" data-save-freezer-name="${freezer.id}">✓</button>`
          : `<button class="icon-btn" data-edit-freezer="${freezer.id}">✎</button>`}
        <button class="icon-btn danger" data-del-freezer="${freezer.id}">🗑</button>
      </div>
      <span class="chevron">▸</span>
    </div>
    <div class="shelf-body">
      ${isConfirming ? `
        <div class="confirm-row">
          Gefrierschrank "${escapeHtml(freezer.name)}" mit allen Fächern und Inhalten löschen?
          <button class="confirm-yes" data-confirm-del-freezer="${freezer.id}">Löschen</button>
          <button class="confirm-no" data-cancel-del>Abbrechen</button>
        </div>` : ''}
      ${freezer.boards.length > 0 ? `<div class="shelf-hint">Oberstes Fach zuerst · Fach A = unterstes Fach</div>` : ''}
      ${boardsHtml}
      ${freezer.boards.length === 0 ? `<div style="padding:6px 4px; color:var(--ink-soft); font-size:13px;">Noch keine Fächer in diesem Schrank.</div>` : ''}
      <button class="add-shelf-trigger" data-add-freezer-board="${freezer.id}">+ Fach hinzufügen (oben drauf)</button>
    </div>
  </div>`;
}

function renderFreezerBoard(freezer, board, letter){
  const isOpen = !!board._open;
  const isConfirming = confirmDeleteId === ('freezerboard:' + freezer.id + ':' + board.id);
  const isAdding = addingFreezerItemFor && addingFreezerItemFor.freezerId === freezer.id && addingFreezerItemFor.boardId === board.id;

  const sortedItems = [...board.items].sort((a,b)=>a.name.localeCompare(b.name));

  return `
  <div class="board ${isOpen?'open':''}" data-board="${board.id}">
    <div class="board-header" data-toggle-freezer-board="${freezer.id}:${board.id}">
      <span class="board-badge">${letter}</span>
      <span class="board-label">Fach ${letter}</span>
      <span class="board-count">${board.items.length}</span>
      <button class="icon-btn danger" data-del-freezer-board="${freezer.id}:${board.id}">🗑</button>
      <span class="chevron">▸</span>
    </div>
    <div class="board-body">
      ${isConfirming ? `
        <div class="confirm-row">
          Fach ${letter} mit allen Gegenständen löschen?
          <button class="confirm-yes" data-confirm-del-freezer-board="${freezer.id}:${board.id}">Löschen</button>
          <button class="confirm-no" data-cancel-del>Abbrechen</button>
        </div>` : ''}
      ${sortedItems.length === 0 ? `<div style="padding:4px 4px 6px; color:var(--ink-soft); font-size:12.5px;">Noch keine Gegenstände hier.</div>` : ''}
      ${sortedItems.map(item => renderFreezerItem(freezer, board, item)).join('')}
      ${isAdding ? renderFreezerItemForm(freezer, board, null) : `<button class="add-shelf-trigger" data-add-freezer-item-trigger="${freezer.id}:${board.id}">+ Gegenstand hinzufügen</button>`}
    </div>
  </div>`;
}

function renderFreezerItem(freezer, board, item){
  const isEditing = editingFreezerItem && editingFreezerItem.freezerId===freezer.id && editingFreezerItem.boardId===board.id && editingFreezerItem.itemId===item.id;
  if(isEditing) return renderFreezerItemForm(freezer, board, item);

  const isConfirming = confirmDeleteId === ('freezeritem:' + freezer.id + ':' + board.id + ':' + item.id);
  const low = Number(item.qty) <= 1;
  const thumb = item.photo
    ? `<img class="item-thumb" src="${item.photo}" data-view-photo="${item.id}">`
    : `<div class="item-thumb-placeholder">🧊</div>`;

  return `
  <div class="item-row ${low?'qty-low':''}">
    ${thumb}
    <div class="item-main">
      <div class="item-top-line">
        <span class="item-name">${escapeHtml(item.name)}</span>
      </div>
      ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}
      ${isConfirming ? `
        <div class="confirm-row">
          Löschen?
          <button class="confirm-yes" data-confirm-del-freezer-item="${freezer.id}:${board.id}:${item.id}">Ja</button>
          <button class="confirm-no" data-cancel-del>Nein</button>
        </div>` : ''}
    </div>
    <div class="qty-stepper">
      <button data-freezer-qty-dec="${freezer.id}:${board.id}:${item.id}">−</button>
      <span class="qty-val">${item.qty}</span>
      <button data-freezer-qty-inc="${freezer.id}:${board.id}:${item.id}">+</button>
    </div>
    <div class="item-actions">
      <button class="icon-btn" data-edit-freezer-item="${freezer.id}:${board.id}:${item.id}">✎</button>
      <button class="icon-btn danger" data-del-freezer-item="${freezer.id}:${board.id}:${item.id}">🗑</button>
    </div>
  </div>`;
}

function renderFreezerItemForm(freezer, board, item){
  const isEdit = !!item;
  const photoSrc = pendingPhoto !== null ? pendingPhoto : (isEdit ? item.photo : null);
  return `
  <div class="add-shelf-card" data-freezer-item-form="${freezer.id}:${board.id}:${isEdit?item.id:''}">
    <div class="scan-form">
      <label>Bezeichnung</label>

      ${renderUnitsPerScanField('fzFormUnits', isEdit ? item.unitsPerScan : 1, false, null)}
      ${renderAutoShopCheckbox('fzFormUnits', isEdit ? item.autoShop : true)}

function renderAddFreezer(){
  if(!addingFreezer) return `<button class="add-shelf-trigger top-level" id="addFreezerTrigger">+ Neuen Gefrierschrank anlegen</button>`;
  return `
    <div class="add-shelf-card">
      <div class="add-shelf-form">
        <label>Name des Gefrierschranks</label>
        <input type="text" id="newFreezerName" placeholder="z.B. Gefrierschrank Keller">
        <label>Anzahl Fächer (optional, kann später ergänzt werden)</label>
        <input type="number" id="newFreezerBoards" placeholder="z.B. 3" min="0">
        <button id="confirmAddFreezer">Anlegen</button>
      </div>
    </div>`;
}

function attachFreezerHandlers(){
  document.querySelectorAll('[data-freezer-search-hit]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('.qty-stepper')) return;
    const [fid,bid,iid] = el.getAttribute('data-freezer-search-hit').split(':');
    editingFreezerItem = {freezerId:fid, boardId:bid, itemId:iid};
    pendingPhoto = null;
    render();
  }));

  document.querySelectorAll('[data-toggle-freezer]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('.shelf-actions') || e.target.closest('input')) return;
    const fz = freezerData.freezers.find(f=>f.id===el.getAttribute('data-toggle-freezer'));
    fz._open = !fz._open; render();
  }));
  document.querySelectorAll('[data-toggle-freezer-board]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('.icon-btn')) return;
    const [fid,bid] = el.getAttribute('data-toggle-freezer-board').split(':');
    const fz = freezerData.freezers.find(f=>f.id===fid);
    const board = fz.boards.find(b=>b.id===bid);
    board._open = !board._open; render();
  }));

  document.querySelectorAll('[data-edit-freezer]').forEach(el=>el.addEventListener('click', ()=>{
    editingFreezerId = el.getAttribute('data-edit-freezer'); render();
    const inp = document.querySelector('.freezer-name-input'); if(inp){inp.focus(); inp.select();}
  }));
  document.querySelectorAll('[data-save-freezer-name]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-save-freezer-name');
    const inp = document.querySelector(`.freezer-name-input[data-freezer="${id}"]`);
    const fz = freezerData.freezers.find(f=>f.id===id);
    if(inp && inp.value.trim()) fz.name = inp.value.trim();
    editingFreezerId = null; queueSaveFreezer(); render();
  }));
  document.querySelectorAll('.freezer-name-input').forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') document.querySelector('[data-save-freezer-name]').click(); });
  });

  document.querySelectorAll('[data-del-freezer]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDeleteId = 'freezer:' + el.getAttribute('data-del-freezer');
    freezerData.freezers.find(f=>f.id===el.getAttribute('data-del-freezer'))._open = true;
    render();
  }));
  document.querySelectorAll('[data-confirm-del-freezer]').forEach(el=>el.addEventListener('click', ()=>{
    freezerData.freezers = freezerData.freezers.filter(f=>f.id!==el.getAttribute('data-confirm-del-freezer'));
    confirmDeleteId = null; queueSaveFreezer(); showToastMsg('Gefrierschrank gelöscht'); render();
  }));

  document.querySelectorAll('[data-add-freezer-board]').forEach(el=>el.addEventListener('click', ()=>{
    const fz = freezerData.freezers.find(f=>f.id===el.getAttribute('data-add-freezer-board'));
    fz.boards.push({id:uid(), items:[], _open:true});
    queueSaveFreezer(); render();
  }));
  document.querySelectorAll('[data-del-freezer-board]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid] = el.getAttribute('data-del-freezer-board').split(':');
    confirmDeleteId = 'freezerboard:' + fid + ':' + bid;
    freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid)._open = true;
    render();
  }));
  document.querySelectorAll('[data-confirm-del-freezer-board]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid] = el.getAttribute('data-confirm-del-freezer-board').split(':');
    const fz = freezerData.freezers.find(f=>f.id===fid);
    fz.boards = fz.boards.filter(b=>b.id!==bid);
    confirmDeleteId = null; queueSaveFreezer(); showToastMsg('Fach gelöscht'); render();
  }));

  document.querySelectorAll('[data-cancel-del]').forEach(el=>el.addEventListener('click', ()=>{ confirmDeleteId = null; render(); }));

  document.querySelectorAll('[data-freezer-qty-inc]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid,iid] = el.getAttribute('data-freezer-qty-inc').split(':');
    const item = freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid).items.find(i=>i.id===iid);
    item.qty = (Number(item.qty)||0)+1; queueSaveFreezer(); render();
  }));
  document.querySelectorAll('[data-freezer-qty-dec]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid,iid] = el.getAttribute('data-freezer-qty-dec').split(':');
    const item = freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid).items.find(i=>i.id===iid);
    item.qty = Math.max(0,(Number(item.qty)||0)-1); queueSaveFreezer(); render();
  }));

  document.querySelectorAll('[data-edit-freezer-item]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid,iid] = el.getAttribute('data-edit-freezer-item').split(':');
    editingFreezerItem = {freezerId:fid, boardId:bid, itemId:iid};
    pendingPhoto = null; render();
    const inp = document.getElementById('fzFormName'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-del-freezer-item]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDeleteId = 'freezeritem:' + el.getAttribute('data-del-freezer-item'); render();
  }));
  document.querySelectorAll('[data-confirm-del-freezer-item]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid,iid] = el.getAttribute('data-confirm-del-freezer-item').split(':');
    const board = freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid);
    board.items = board.items.filter(i=>i.id!==iid);
    confirmDeleteId = null; queueSaveFreezer(); showToastMsg('Gegenstand gelöscht'); render();
  }));

  document.querySelectorAll('[data-add-freezer-item-trigger]').forEach(el=>el.addEventListener('click', ()=>{
    const [fid,bid] = el.getAttribute('data-add-freezer-item-trigger').split(':');
    addingFreezerItemFor = {freezerId:fid, boardId:bid};
    pendingPhoto = null; render();
    const inp = document.getElementById('fzFormName'); if(inp) inp.focus();
  }));

  document.querySelectorAll('[data-view-photo]').forEach(el=>el.addEventListener('click', ()=>showPhotoOverlay(el.getAttribute('src'))));

  const fzForm = document.querySelector('[data-freezer-item-form]');
  if(fzForm){
    const [fid, bid, iid] = fzForm.getAttribute('data-freezer-item-form').split(':');
    attachUnitsToggle('fzFormUnits');
    const photoTrigger = document.getElementById('fzFormPhotoTrigger');
    const photoInput = document.getElementById('fzFormPhotoInput');
    const photoRemove = document.getElementById('fzFormPhotoRemove');
    if(photoTrigger) photoTrigger.addEventListener('click', ()=>photoInput.click());
    if(photoInput) photoInput.addEventListener('change', async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      showToastMsg('Foto wird verarbeitet …');
      try{ pendingPhoto = await resizeImageFile(file, 640, 0.65); render(); }
      catch(e){ showToastMsg('Foto konnte nicht geladen werden'); }
    });
    if(photoRemove) photoRemove.addEventListener('click', ()=>{ pendingPhoto = ''; render(); });

    document.getElementById('fzFormCancel').addEventListener('click', ()=>{
      editingFreezerItem = null; addingFreezerItemFor = null; pendingPhoto = null; render();
    });
    document.getElementById('fzFormSave').addEventListener('click', ()=>{
      const name = document.getElementById('fzFormName').value.trim();
      const qty = Number(document.getElementById('fzFormQty').value) || 0;
      const note = document.getElementById('fzFormNote').value.trim();
      const unitsPerScan = Math.max(1, Number(document.getElementById('fzFormUnitsUnitsPerScan').value) || 1);
      const autoShop = document.getElementById('fzFormUnitsAutoShop').checked;
      if(!name){ showToastMsg('Bitte eine Bezeichnung eingeben'); return; }

      let finalPhoto;
      if(pendingPhoto === null){ finalPhoto = iid ? freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid).items.find(i=>i.id===iid).photo || null : null; }
      else if(pendingPhoto === ''){ finalPhoto = null; }
      else { finalPhoto = pendingPhoto; }

      const board = freezerData.freezers.find(f=>f.id===fid).boards.find(b=>b.id===bid);
      if(iid){
        const item = board.items.find(i=>i.id===iid);
        item.name = name; item.qty = qty; item.note = note; item.photo = finalPhoto; item.unitsPerScan = unitsPerScan; item.autoShop = autoShop;
      } else {
        board.items.push({id:uid(), name, qty, note, photo: finalPhoto, unitsPerScan, autoShop});
      }
      editingFreezerItem = null; addingFreezerItemFor = null; pendingPhoto = null;
      queueSaveFreezer(); render();
    });
    ['fzFormName','fzFormQty','fzFormNote'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('fzFormSave').click(); });
    });
  }

  const addTrigger = document.getElementById('addFreezerTrigger');
  if(addTrigger) addTrigger.addEventListener('click', ()=>{
    addingFreezer = true; render();
    const inp = document.getElementById('newFreezerName'); if(inp) inp.focus();
  });
  const confirmAddFreezerBtn = document.getElementById('confirmAddFreezer');
  if(confirmAddFreezerBtn){
    confirmAddFreezerBtn.addEventListener('click', ()=>{
      const name = document.getElementById('newFreezerName').value.trim();
      const boardCount = Number(document.getElementById('newFreezerBoards').value) || 0;
      if(!name){ showToastMsg('Bitte einen Namen eingeben'); return; }
      const boards = [];
      for(let i=0;i<boardCount;i++) boards.push({id:uid(), items:[], _open:false});
      if(boards.length) boards[0]._open = true;
      freezerData.freezers.push({id:uid(), name, boards, _open:true});
      addingFreezer = false;
      queueSaveFreezer(); render();
    });
    document.getElementById('newFreezerName').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmAddFreezerBtn.click(); });
    document.getElementById('newFreezerBoards').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmAddFreezerBtn.click(); });
  }
}

// ---------- Shopping list ----------

function collectLowStockItems(){
  const results = [];
  const threshold = Number(shoppingListData.threshold) || 3;

  data.shelves.forEach(shelf=>{
    let realIdx = 0;
    shelf.boards.forEach(board=>{
      const letter = board.floor ? 'Boden' : boardLetter(realIdx);
      if(!board.floor) realIdx++;
      board.items.forEach(item=>{
        if(item.autoShop === false) return;
        const qty = Number(item.qty)||0;
        if(qty <= threshold){
          results.push({ id:item.id, name:item.name, qty, location: `${shelf.name} · ${letter}` });
        }
      });
    });
  });

  freezerData.freezers.forEach(fz=>{
    fz.boards.forEach((board, idx)=>{
      const letter = boardLetter(idx);
      board.items.forEach(item=>{
        if(item.autoShop === false) return;
        const qty = Number(item.qty)||0;
        if(qty <= threshold){
          results.push({ id:item.id, name:item.name, qty, location: `${fz.name} · Fach ${letter}` });
        }
      });
    });
  });

  // Nur Einträge zeigen, die nicht bei genau dieser Menge schon "erledigt" markiert wurden
  return results.filter(r => shoppingListData.dismissed[r.id] !== r.qty);
}

function renderShoppingListTab(term){
  const t = (term||'').toLowerCase();
  let lowStock = collectLowStockItems();
  let manual = shoppingListData.manual;
  if(t){
    lowStock = lowStock.filter(r=>r.name.toLowerCase().includes(t));
    manual = manual.filter(m=>m.name.toLowerCase().includes(t));
  }
  return `
    <div class="threshold-row">
      Automatisch auf die Liste, wenn Menge ≤
      <input type="number" id="thresholdInput" value="${shoppingListData.threshold}" min="0">
      ist
    </div>

    <div class="section-label">Wird knapp (automatisch)</div>
    ${lowStock.length === 0
      ? `<div style="color:var(--ink-soft); font-size:12.5px; padding:2px 2px 12px;">${t ? 'Nichts gefunden.' : 'Gerade ist nichts knapp.'}</div>`
      : lowStock.map(r => `
        <div class="shop-item">
          <button class="shop-check" data-dismiss-low="${r.id}:${r.qty}" title="Erledigt">✓</button>
          <div class="shop-main">
            <div class="shop-name">${escapeHtml(r.name)}</div>
            <div class="shop-sub">${escapeHtml(r.location)} · noch ${r.qty}</div>
          </div>
        </div>
      `).join('')
    }

    <div class="section-label">Sonstiges</div>
    ${manual.length === 0
      ? `<div style="color:var(--ink-soft); font-size:12.5px; padding:2px 2px 6px;">${t ? 'Nichts gefunden.' : 'Noch nichts von Hand hinzugefügt.'}</div>`
      : manual.map(m => `
        <div class="shop-item">
          <button class="shop-check" data-dismiss-manual="${m.id}" title="Erledigt">✓</button>
          <div class="shop-main"><div class="shop-name">${escapeHtml(m.name)}</div></div>
        </div>
      `).join('')
    }
    <div class="shop-add-row">
      <input type="text" id="newManualItem" placeholder="Weiteren Artikel hinzufügen …">
      <button id="confirmAddManual">Hinzufügen</button>
    </div>
  `;
}

function attachShoppingListHandlers(){
  const thresholdInput = document.getElementById('thresholdInput');
  thresholdInput.addEventListener('change', ()=>{
    const val = Math.max(0, Number(thresholdInput.value) || 0);
    shoppingListData.threshold = val;
    queueSaveShopping();
    render();
  });

  document.querySelectorAll('[data-dismiss-low]').forEach(el=>el.addEventListener('click', ()=>{
    const [id, qty] = el.getAttribute('data-dismiss-low').split(':');
    shoppingListData.dismissed[id] = Number(qty);
    queueSaveShopping();
    showToastMsg('Erledigt');
    render();
  }));

// ---------- Barcode scanner ----------

function findItemByBarcode(code, target){
  const containers = target === 'gefrier' ? freezerData.freezers : data.shelves;
  for(const container of containers){
    for(const board of container.boards){
      for(const item of board.items){
        if(item.barcode && item.barcode === code) return {container, board, item};
      }
    }
  }
  return null;
}

function boardOptionsForShelf(shelf, unitLabel){
  const label = unitLabel || 'Brett';
  const realBoards = shelf.boards.filter(b=>!b.floor);
  const opts = realBoards.map((b,i)=>({id:b.id, label:label + ' ' + boardLetter(i)}));
  shelf.boards.filter(b=>b.floor).forEach(b=>opts.push({id:b.id, label:'Boden'}));
  return opts;
}

function openBarcodeScanner(target){
  scanTarget = target || 'inventar';
  pendingBarcodePhoto = null;
  scanMode = 'add';
  lastScan = {code:null, time:0};
  document.getElementById('scanOverlay').style.display = 'flex';
  startCameraAndDetection();
}

async function startCameraAndDetection(){
  const card = document.getElementById('scanCard');
  const targetLabel = scanTarget === 'gefrier' ? 'Gefrierschrank' : 'Abstellkammer';
  card.innerHTML = `
    <button class="scan-close" id="scanCloseBtn">✕</button>
    <div class="lock-title" style="margin-bottom:8px;">Barcode scannen – ${targetLabel}</div>
    ${scanModeToggleHtml()}
    <div class="scan-video-wrap"><video id="scanVideo" autoplay playsinline muted></video></div>
    <div class="scan-status" id="scanStatus">Kamera wird gestartet …</div>
  `;
  document.getElementById('scanCloseBtn').addEventListener('click', closeScanner);
  attachScanModeToggleHandlers();

  if(!window.isSecureContext){
    showManualBarcodeEntry('Kamera braucht eine sichere (https) Verbindung. Bitte die Seite über die richtige https-Adresse (z.B. deinen GitHub-Pages-Link) öffnen, nicht als lokale Datei. Bis dahin kannst du die Nummer hier eintippen.');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showManualBarcodeEntry('Dieser Browser unterstützt keinen Kamerazugriff – bitte Nummer eingeben.');
    return;
  }

  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch(e){
    let msg = 'Kamera nicht verfügbar – bitte Nummer eingeben.';
    if(e && e.name === 'NotAllowedError') msg = 'Kamerazugriff wurde blockiert. Bitte in den Website-Einstellungen des Browsers die Kamera erlauben, oder Nummer eingeben.';
    else if(e && e.name === 'NotFoundError') msg = 'Es wurde keine Kamera gefunden – bitte Nummer eingeben.';
    else if(e && e.name === 'NotReadableError') msg = 'Kamera wird gerade von einer anderen App benutzt – bitte Nummer eingeben.';
    showManualBarcodeEntry(msg);
    return;
  }
  const video = document.getElementById('scanVideo');
  video.srcObject = scanStream;

  if(!('BarcodeDetector' in window)){
    showManualBarcodeEntry('Barcode-Erkennung wird von diesem Browser nicht unterstützt – bitte Nummer eingeben.');
    return;
  }

  document.getElementById('scanStatus').textContent = 'Halte den Barcode vor die Kamera …';
  let detector;
  try{
    detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'] });
  } catch(e){
    showManualBarcodeEntry('Barcode-Erkennung konnte nicht gestartet werden – bitte Nummer eingeben.');
    return;
  }

  scanDetectorInterval = setInterval(async ()=>{
    try{
      const results = await detector.detect(video);
      if(results && results.length > 0){
        const code = results[0].rawValue;
        const now = Date.now();
        if(code === lastScan.code && (now - lastScan.time) < 2200) return;
        lastScan = {code, time: now};
        handleBarcodeDetected(code);
      }
    } catch(e){ /* ignore transient detection errors */ }
  }, 400);
}

function scanModeToggleHtml(){
  return `
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <button type="button" class="tab-btn ${scanMode==='add'?'active':''}" id="scanModeAdd" style="flex:1;">➕ Hinzufügen</button>
      <button type="button" class="tab-btn ${scanMode==='remove'?'active':''}" id="scanModeRemove" style="flex:1;">➖ Herausnehmen</button>
    </div>`;
}

function attachScanModeToggleHandlers(){

function stopScanCamera(){
  if(scanDetectorInterval){ clearInterval(scanDetectorInterval); scanDetectorInterval = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }

function closeScanner(){
  stopScanCamera();

  pendingBarcodePhoto = null;
}

function afterQuickScanFeedback(msg){
  const status = document.getElementById('scanStatus');
  if(status) status.textContent = msg;
  const manualInput = document.getElementById('manualBarcodeInput');
  if(manualInput){ manualInput.value = ''; manualInput.focus(); }
  render();

function handleBarcodeDetected(code){
  const match = findItemByBarcode(code, scanTarget);
  const save = scanTarget === 'gefrier' ? queueSaveFreezer : queueSave;

  if(scanMode === 'remove'){
    if(match){
      const perScan = Math.max(1, Number(match.item.unitsPerScan) || 1);
      match.item.qty = Math.max(0, (Number(match.item.qty)||0) - perScan);
      save();
      showToastMsg(`${match.item.name}: Menge auf ${match.item.qty} verringert`);
      afterQuickScanFeedback(`✅ ${match.item.name} entnommen (jetzt ${match.item.qty}) – nächsten Barcode scannen …`);
    } else {
      showToastMsg('Barcode nicht im Bestand gefunden');
      afterQuickScanFeedback('⚠️ Dieser Barcode ist nicht im Bestand – nächsten Barcode scannen …');
    }
    return;
  }

  // add mode
  if(match){
    const perScan = Math.max(1, Number(match.item.unitsPerScan) || 1);
    match.item.qty = (Number(match.item.qty)||0) + perScan;
    save();
    showToastMsg(`${match.item.name}: Menge auf ${match.item.qty} erhöht (+${perScan})`);
    afterQuickScanFeedback(`✅ ${match.item.name} hinzugefügt (jetzt ${match.item.qty}) – nächsten Barcode scannen …`);
    return;
  }
  stopScanCamera();
  showNewBarcodeItemForm(code);
}

function detectUnitsFromQuantity(qtyStr){
  if(!qtyStr) return null;
  const s = qtyStr.toLowerCase();
  let m = s.match(/(\d+)\s*[x×]\s*\d/);          // z.B. "6 x 65 g"
  if(m) return parseInt(m[1]);
  m = s.match(/(\d+)\s*(stück|stk\.?|st\.)/);     // z.B. "6 Stück", "6 Stk"
  if(m) return parseInt(m[1]);
  m = s.match(/(\d+)\s*er\b/);                    // z.B. "6er"
  if(m) return parseInt(m[1]);
  m = s.match(/netz.*?(\d+)|(\d+).*?netz/);        // z.B. "Netz 6 Stück"
  if(m) return parseInt(m[1] || m[2]);
  return null;
}

// Typische Netz-/Beutelware, bei der öfter mehrere Stück in einer Packung sind,
// auch wenn die Datenbank keine genaue Stückzahl angibt.
const NET_PRODUCT_KEYWORDS = [
  'zwiebel','kartoffel','knoblauch','schalotte','mandarine','clementine',
  'zitrone','limette','möhre','karotte','apfel','äpfel','orange','pfirsich',
  'nektarine','avocado','kiwi'
];

function nameSuggestsNetProduct(name){
  if(!name) return false;
  const s = name.toLowerCase();
  return NET_PRODUCT_KEYWORDS.some(k => s.includes(k));
}

async function lookupOpenFoodFacts(code){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
    if(!res.ok) return null;
    const json = await res.json();
    if(json && json.status === 1 && json.product){
      const p = json.product;
      const name = p.product_name_de || p.product_name || p.generic_name_de || p.generic_name || '';
      // Nur echte "Front of Pack"-Produktfotos übernehmen. p.image_url ist oft nur ein
      // schnelles Roh-Foto vom Scannen (mit Barcode-Rahmen) und wird bewusst NICHT genutzt.
      const photo = p.image_front_url || null;
      const detectedUnits = detectUnitsFromQuantity(p.quantity || p.product_quantity_unit || '');
      // Wenn keine genaue Zahl gefunden wurde, aber der Name auf typische Netzware hindeutet
      // (Zwiebeln, Kartoffeln, ...), das Feld trotzdem aufklappen, damit die Stückzahl von Hand
      // eingetragen werden kann.
      const likelyNetProduct = !detectedUnits && nameSuggestsNetProduct(name);
      return { name, photo, detectedUnits, likelyNetProduct };
    }
  } catch(e){ /* Datenbank nicht erreichbar oder Produkt unbekannt */ }
  return null;
}

      <input type="number" id="${idPrefix}UnitsPerScan" value="${val}" min="1">
    </div>
  `;
}

      <button class="scan-close" id="scanCloseBtn">✕</button>
      <div class="lock-title" style="margin-bottom:4px;">Neues Produkt${isFreezer ? ' (Gefrierschrank)' : ''}</div>

        <label>Menge</label>
        <input type="number" id="scanQty" value="1" min="0">
        ${renderUnitsPerScanField(

          !!(offResult && (offResult.detectedUnits || offResult.likelyNetProduct)),
          (offResult && offResult.detectedUnits) ? 'automatisch erkannt – bitte prüfen'
            : (offResult && offResult.likelyNetProduct) ? 'wird oft im Netz verkauft – Stückzahl eintragen'

        )}

    render();
    const inp = document.getElementById('formName'); if(inp) inp.focus();
  }));

  // photo view overlay
  document.querySelectorAll('[data-view-photo]').forEach(el=>el.addEventListener('click', ()=>showPhotoOverlay(el.getAttribute('src'))));
  document.querySelectorAll('[data-view-photo-search]').forEach(el=>el.addEventListener('click', ()=>showPhotoOverlay(el.getAttribute('src'))));

  // item form (shared add/edit)
  const form = document.querySelector('[data-item-form]');
  if(form){
    const [sid, bid, iid] = form.getAttribute('data-item-form').split(':');
    attachUnitsToggle('formUnits');
    const photoTrigger = document.getElementById('formPhotoTrigger');
    const photoInput = document.getElementById('formPhotoInput');
    const photoRemove = document.getElementById('formPhotoRemove');
    if(photoTrigger) photoTrigger.addEventListener('click', ()=>photoInput.click());
    if(photoInput) photoInput.addEventListener('change', async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      showToastMsg('Foto wird verarbeitet …');
      try{
        pendingPhoto = await resizeImageFile(file, 640, 0.65);
        render();
      } catch(e){ showToastMsg('Foto konnte nicht geladen werden'); }
    });
    if(photoRemove) photoRemove.addEventListener('click', ()=>{ pendingPhoto = ''; render(); });

    document.getElementById('formCancel').addEventListener('click', ()=>{
      editingItem = null; addingItemFor = null; pendingPhoto = null; render();
    });
    document.getElementById('formSave').addEventListener('click', ()=>{
      const name = document.getElementById('formName').value.trim();
      const reiheRaw = document.getElementById('formReihe').value;
      const qty = Number(document.getElementById('formQty').value) || 0;
      const note = document.getElementById('formNote').value.trim();
      const unitsPerScan = Math.max(1, Number(document.getElementById('formUnitsUnitsPerScan').value) || 1);
      const autoShop = document.getElementById('formUnitsAutoShop').checked;
      if(!name){ showToastMsg('Bitte eine Bezeichnung eingeben'); return; }
      const reihe = reiheRaw === '' ? null : Number(reiheRaw);

      let finalPhoto;
      if(pendingPhoto === null){
        finalPhoto = iid ? findItem(sid,bid,iid).photo || null : null;
      } else if(pendingPhoto === ''){
        finalPhoto = null;
      } else {
        finalPhoto = pendingPhoto;
      }

      if(iid){
        const item = findItem(sid,bid,iid);
        item.name = name; item.qty = qty; item.note = note; item.reihe = reihe; item.photo = finalPhoto; item.unitsPerScan = unitsPerScan; item.autoShop = autoShop;
      } else {
        const board = findBoard(sid,bid);
        board.items.push({id:uid(), name, qty, note, reihe, photo: finalPhoto, unitsPerScan, autoShop});
      }
      editingItem = null; addingItemFor = null; pendingPhoto = null;
      queueSave(); render();
    });
    ['formName','formReihe','formQty','formNote'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('formSave').click(); });
    });
  }
}

function attachAddShelfHandlers(){
  const trigger = document.getElementById('addShelfTrigger');
  if(trigger) trigger.addEventListener('click', ()=>{ addingShelf = true; render(); const inp=document.getElementById('newShelfName'); if(inp) inp.focus(); });

  const confirmBtn = document.getElementById('confirmAddShelf');
  if(confirmBtn){
    confirmBtn.addEventListener('click', ()=>{
      const name = document.getElementById('newShelfName').value.trim();
      const boardCount = Number(document.getElementById('newShelfBoards').value) || 0;
      const wantsFloor = document.getElementById('newShelfFloor').checked;
      if(!name){ showToastMsg('Bitte einen Namen eingeben'); return; }
      const boards = [];
      for(let i=0;i<boardCount;i++) boards.push({id:uid(), items:[], _open:false});
      if(boards.length) boards[0]._open = true;
      if(wantsFloor) boards.push({id:uid(), items:[], _open:false, floor:true});
      data.shelves.push({id:uid(), name, boards, _open:true});
      addingShelf = false;
      queueSave(); render();
    });
    document.getElementById('newShelfName').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmBtn.click(); });
    document.getElementById('newShelfBoards').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmBtn.click(); });
  }
}

function attachRecipeHandlers(){
  document.querySelectorAll('[data-toggle-recipe]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('.shelf-actions') || e.target.closest('input')) return;
    const r = recipesData.recipes.find(r=>r.id===el.getAttribute('data-toggle-recipe'));
    r._open = !r._open; render();
  }));

  document.querySelectorAll('[data-edit-recipe]').forEach(el=>el.addEventListener('click', ()=>{
    editingRecipeId = el.getAttribute('data-edit-recipe'); render();
    const inp = document.querySelector('.recipe-name-input'); if(inp){inp.focus(); inp.select();}
  }));
  document.querySelectorAll('[data-save-recipe-name]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-save-recipe-name');
    const inp = document.querySelector(`.recipe-name-input[data-recipe="${id}"]`);
    const r = recipesData.recipes.find(r=>r.id===id);
    if(inp && inp.value.trim()) r.name = inp.value.trim();
    editingRecipeId = null; queueSaveRecipes(); render();
  }));
  document.querySelectorAll('.recipe-name-input').forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') document.querySelector('[data-save-recipe-name]').click(); });
  });

  document.querySelectorAll('[data-del-recipe]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDeleteId = 'recipe:' + el.getAttribute('data-del-recipe');
    recipesData.recipes.find(r=>r.id===el.getAttribute('data-del-recipe'))._open = true;
    render();
  }));
  document.querySelectorAll('[data-confirm-del-recipe]').forEach(el=>el.addEventListener('click', ()=>{
    recipesData.recipes = recipesData.recipes.filter(r=>r.id!==el.getAttribute('data-confirm-del-recipe'));
    confirmDeleteId = null; queueSaveRecipes(); showToastMsg('Rezept gelöscht'); render();
  }));
  document.querySelectorAll('[data-cancel-del]').forEach(el=>el.addEventListener('click', ()=>{ confirmDeleteId = null; render(); }));

  // ingredients
  document.querySelectorAll('[data-add-ing-trigger]').forEach(el=>el.addEventListener('click', ()=>{
    addingIngredientFor = el.getAttribute('data-add-ing-trigger'); render();
    const inp = document.getElementById('ingName'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-edit-ing]').forEach(el=>el.addEventListener('click', ()=>{
    const [rid,iid] = el.getAttribute('data-edit-ing').split(':');
    editingIngredient = {recipeId:rid, ingId:iid}; render();
    const inp = document.getElementById('ingName'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-del-ing]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDeleteId = 'ingredient:' + el.getAttribute('data-del-ing'); render();
  }));
  document.querySelectorAll('[data-confirm-del-ing]').forEach(el=>el.addEventListener('click', ()=>{
    const [rid,iid] = el.getAttribute('data-confirm-del-ing').split(':');
    const r = recipesData.recipes.find(r=>r.id===rid);
    r.ingredients = r.ingredients.filter(i=>i.id!==iid);
    confirmDeleteId = null; queueSaveRecipes(); render();
  }));

  const ingForm = document.querySelector('[data-ing-form]');
  if(ingForm){
    const [rid, iid] = ingForm.getAttribute('data-ing-form').split(':');
    const ingNameInput = document.getElementById('ingName');
    const suggestBox = document.getElementById('ingNameSuggestions');
    const renderIngSuggestions = ()=>{
      const term = ingNameInput.value.trim().toLowerCase();
      if(!term){ suggestBox.innerHTML=''; return; }
      const names = getAllProductNames().filter(n=>n.toLowerCase().includes(term)).slice(0,8);
      if(names.length===0){ suggestBox.innerHTML=''; return; }
      suggestBox.innerHTML = names.map(n=>`<div class="ing-suggestion-item" data-pick="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('');
      suggestBox.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>{
        ingNameInput.value = el.getAttribute('data-pick');
        suggestBox.innerHTML = '';
      }));
    };
    ingNameInput.addEventListener('input', renderIngSuggestions);
    ingNameInput.addEventListener('focus', renderIngSuggestions);
    document.getElementById('ingCancel').addEventListener('click', ()=>{ addingIngredientFor=null; editingIngredient=null; render(); });
    document.getElementById('ingSave').addEventListener('click', ()=>{
      const name = document.getElementById('ingName').value.trim();
      const amount = Number(document.getElementById('ingAmount').value) || 0;
      if(!name){ showToastMsg('Bitte einen Namen eingeben'); return; }
      const r = recipesData.recipes.find(r=>r.id===rid);
      if(iid){ const ing = r.ingredients.find(i=>i.id===iid); ing.name=name; ing.amount=amount; }
      else { r.ingredients.push({id:uid(), name, amount}); }
      addingIngredientFor = null; editingIngredient = null;
      queueSaveRecipes(); render();
    });
    ['ingName','ingAmount'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('ingSave').click(); });
    });
  }

  // steps
  document.querySelectorAll('[data-add-step-trigger]').forEach(el=>el.addEventListener('click', ()=>{
    addingStepFor = el.getAttribute('data-add-step-trigger'); render();
    const inp = document.getElementById('stepText'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-edit-step]').forEach(el=>el.addEventListener('click', ()=>{
    const [rid,sid] = el.getAttribute('data-edit-step').split(':');
    editingStep = {recipeId:rid, stepId:sid}; render();
    const inp = document.getElementById('stepText'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-del-step]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDeleteId = 'step:' + el.getAttribute('data-del-step'); render();
  }));
  document.querySelectorAll('[data-confirm-del-step]').forEach(el=>el.addEventListener('click', ()=>{
    const [rid,sid] = el.getAttribute('data-confirm-del-step').split(':');
    const r = recipesData.recipes.find(r=>r.id===rid);
    r.steps = r.steps.filter(s=>s.id!==sid);
    confirmDeleteId = null; queueSaveRecipes(); render();
  }));

  const stepForm = document.querySelector('[data-step-form]');
  if(stepForm){
    const [rid, sid] = stepForm.getAttribute('data-step-form').split(':');
    document.getElementById('stepCancel').addEventListener('click', ()=>{ addingStepFor=null; editingStep=null; render(); });
    document.getElementById('stepSave').addEventListener('click', ()=>{
      const text = document.getElementById('stepText').value.trim();
      if(!text){ showToastMsg('Bitte einen Text eingeben'); return; }
      const r = recipesData.recipes.find(r=>r.id===rid);
      if(sid){ const step = r.steps.find(s=>s.id===sid); step.text = text; }
      else { r.steps.push({id:uid(), text}); }
      addingStepFor = null; editingStep = null;
      queueSaveRecipes(); render();
    });
    document.getElementById('stepText').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('stepSave').click(); });
  }

  // cook
  document.querySelectorAll('[data-cook]').forEach(el=>el.addEventListener('click', ()=>{
    cookRecipe(el.getAttribute('data-cook'));
  }));

  // add recipe
  const addTrigger = document.getElementById('addRecipeTrigger');
  if(addTrigger) addTrigger.addEventListener('click', ()=>{
    addingRecipe = true; render();
    const inp = document.getElementById('newRecipeName'); if(inp) inp.focus();
  });
  const confirmAddRecipeBtn = document.getElementById('confirmAddRecipe');
  if(confirmAddRecipeBtn){
    confirmAddRecipeBtn.addEventListener('click', ()=>{
      const name = document.getElementById('newRecipeName').value.trim();
      if(!name){ showToastMsg('Bitte einen Namen eingeben'); return; }
      recipesData.recipes.push({id:uid(), name, ingredients:[], steps:[], _open:true});
      addingRecipe = false;
      queueSaveRecipes(); render();
    });
    document.getElementById('newRecipeName').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmAddRecipeBtn.click(); });
  }
}

  document.getElementById('tabGefrier').classList.toggle('active', tab==='gefrier');
  document.getElementById('tabEinkauf').classList.toggle('active', tab==='einkauf');
}
